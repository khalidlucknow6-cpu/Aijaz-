<!DOCTYPE html>
<html>
<head>
<title>Studio Helmet - Aijaz Ahmed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
.box { background:white; padding:15px; margin-bottom:20px; border-radius:10px; }
input, button { width:100%; padding:8px; margin-top:8px; }
button { background:#e91e63; color:white; border:none; border-radius:5px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#e91e63; color:white; }
</style>
</head>

<body>

<h2>Studio Helmet - Aijaz Ahmed</h2>
<p>Address: Gandhi Road, Dehradun</p>

<div class="box">
<h3>Add Sale</h3>
<input type="text" id="customer" placeholder="Customer Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="model" placeholder="Helmet Model">
<input type="number" id="cost" placeholder="Cost Price">
<input type="number" id="sale" placeholder="Sale Price">
<button onclick="addSale()">Add Sale</button>
</div>

<div class="box">
<h3>Sales Record</h3>
<table>
<thead>
<tr>
<th>Customer</th>
<th>Model</th>
<th>Sale</th>
<th>Profit</th>
<th>Invoice</th>
</tr>
</thead>
<tbody id="salesTable"></tbody>
</table>
</div>

<script>
let sales = JSON.parse(localStorage.getItem("sales")) || [];

function addSale() {
let customer = document.getElementById("customer").value;
let mobile = document.getElementById("mobile").value;
let model = document.getElementById("model").value;
let cost = parseFloat(document.getElementById("cost").value) || 0;
let sale = parseFloat(document.getElementById("sale").value) || 0;

if(customer=="" || sale==0){
alert("Enter required fields");
return;
}

let profit = sale - cost;

sales.push({customer, mobile, model, cost, sale, profit});
localStorage.setItem("sales", JSON.stringify(sales));

document.getElementById("customer").value="";
document.getElementById("mobile").value="";
document.getElementById("model").value="";
document.getElementById("cost").value="";
document.getElementById("sale").value="";

displaySales();
}

function displaySales() {
let table = document.getElementById("salesTable");
table.innerHTML="";

sales.forEach((s, index) => {
table.innerHTML += `
<tr>
<td>${s.customer}</td>
<td>${s.model}</td>
<td>₹${s.sale}</td>
<td>₹${s.profit}</td>
<td><button onclick="downloadInvoice(${index})">PDF</button></td>
</tr>
`;
});
}

function downloadInvoice(index){
const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let s = sales[index];

doc.text("Studio Helmet", 20, 20);
doc.text("Owner: Aijaz Ahmed", 20, 30);
doc.text("Address: Gandhi Road, Dehradun", 20, 40);

doc.text("Customer: " + s.customer, 20, 60);
doc.text("Mobile: " + s.mobile, 20, 70);
doc.text("Model: " + s.model, 20, 80);
doc.text("Sale Price: ₹" + s.sale, 20, 90);
doc.text("Profit: ₹" + s.profit, 20, 100);

doc.save("Invoice_"+s.customer+".pdf");
}

displaySales();
</script>

</body>
</html>
