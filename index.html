<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aijaz Helmet Management System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#eef2f7;
    margin:0;
}

header{
    background:#0f172a;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
}

.container{
    padding:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

input{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.add{background:#16a34a;color:white;}
.excel{background:#2563eb;color:white;}
.print{background:#9333ea;color:white;}
.delete{background:#dc2626;color:white;}
.pdf{background:#f97316;color:white;}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1e293b;
    color:white;
    padding:10px;
}

td{
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.search-box{
    margin-top:15px;
}
</style>
</head>

<body>

<header>Aijaz Helmet Sales & Profit System</header>

<div class="container">

<div class="form-grid">
<input type="text" id="customer" placeholder="Customer Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="product" placeholder="Helmet Model">
<input type="number" id="purchase" placeholder="Purchase Price">
<input type="number" id="sale" placeholder="Sale Price">
<input type="number" id="qty" placeholder="Quantity">
</div>

<br>

<button class="add" onclick="addSale()">Add Entry</button>
<button class="excel" onclick="exportExcel()">Export Excel</button>

<div class="search-box">
<input type="text" id="search" placeholder="Search Customer..." onkeyup="searchData()">
</div>

<table id="dataTable">
<thead>
<tr>
<th>Invoice</th>
<th>Customer</th>
<th>Phone</th>
<th>Product</th>
<th>Purchase</th>
<th>Sale</th>
<th>Qty</th>
<th>Profit/Loss</th>
<th>PDF</th>
<th>Delete</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
let sales = JSON.parse(localStorage.getItem("helmetData")) || [];
let invoiceNo = localStorage.getItem("invoiceNo") || 1;

function saveData(){
    localStorage.setItem("helmetData", JSON.stringify(sales));
    localStorage.setItem("invoiceNo", invoiceNo);
}

function addSale(){
    let customer = document.getElementById("customer").value;
    let phone = document.getElementById("phone").value;
    let product = document.getElementById("product").value;
    let purchase = parseFloat(document.getElementById("purchase").value);
    let sale = parseFloat(document.getElementById("sale").value);
    let qty = parseInt(document.getElementById("qty").value);

    if(!customer || !purchase || !sale || !qty){
        alert("Please fill required fields");
        return;
    }

    let profit = (sale - purchase) * qty;

    let entry = {
        invoice:"INV"+invoiceNo,
        customer,phone,product,purchase,sale,qty,profit
    };

    sales.push(entry);
    invoiceNo++;
    saveData();
    renderTable();
    clearForm();
}

function renderTable(){
    let tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML="";
    sales.forEach((data,index)=>{
        tbody.innerHTML += `
        <tr>
        <td>${data.invoice}</td>
        <td>${data.customer}</td>
        <td>${data.phone}</td>
        <td>${data.product}</td>
        <td>${data.purchase}</td>
        <td>${data.sale}</td>
        <td>${data.qty}</td>
        <td style="color:${data.profit>=0?'green':'red'}">${data.profit}</td>
        <td><button class="pdf" onclick='generatePDF(${JSON.stringify(data)})'>PDF</button></td>
        <td><button class="delete" onclick="deleteEntry(${index})">X</button></td>
        </tr>`;
    });
}

function deleteEntry(index){
    sales.splice(index,1);
    saveData();
    renderTable();
}

function clearForm(){
    document.querySelectorAll(".form-grid input").forEach(input=>input.value="");
}

function searchData(){
    let search = document.getElementById("search").value.toLowerCase();
    let filtered = sales.filter(s => s.customer.toLowerCase().includes(search));
    let tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML="";
    filtered.forEach((data,index)=>{
        tbody.innerHTML += `
        <tr>
        <td>${data.invoice}</td>
        <td>${data.customer}</td>
        <td>${data.phone}</td>
        <td>${data.product}</td>
        <td>${data.purchase}</td>
        <td>${data.sale}</td>
        <td>${data.qty}</td>
        <td>${data.profit}</td>
        <td><button class="pdf" onclick='generatePDF(${JSON.stringify(data)})'>PDF</button></td>
        <td></td>
        </tr>`;
    });
}

function generatePDF(data){
    const { jsPDF } = window.jspdf;
    let doc = new jsPDF();

    doc.setFontSize(18);
    doc.text("Aijaz Helmet Invoice",20,20);

    doc.setFontSize(12);
    doc.text("Invoice No: "+data.invoice,20,40);
    doc.text("Customer: "+data.customer,20,50);
    doc.text("Phone: "+data.phone,20,60);
    doc.text("Product: "+data.product,20,70);
    doc.text("Purchase Price: "+data.purchase,20,80);
    doc.text("Sale Price: "+data.sale,20,90);
    doc.text("Quantity: "+data.qty,20,100);
    doc.text("Profit/Loss: "+data.profit,20,110);

    doc.save(data.invoice+".pdf");
}

function exportExcel(){
    let ws = XLSX.utils.json_to_sheet(sales);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Sales");
    XLSX.writeFile(wb,"Aijaz_Helmet_Sales.xlsx");
}

renderTable();
</script>

</body>
</html>
